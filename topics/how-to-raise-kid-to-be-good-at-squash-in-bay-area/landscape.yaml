  - "Is squash a good sport for college admissions?"
  - "How does the US Squash ranking system work for juniors?"
  - "What is the realistic development timeline from beginner to competitive junior?"
  - "How do I find a good squash coach in the Bay Area?"
  - "Squash vs tennis — which racket sport should my kid do?"
  - "How do parents avoid pushing too hard / creating burnout in junior squash?"
  - "What does squash in the Olympics (LA 2028) mean for junior squash?"
  - "How do junior squash tournaments work? How do I sign my kid up?"
  - "What equipment does my kid need and when to upgrade?"
  - "Is my kid good enough to play college squash? What ranking do they need?"
  - "How to balance squash training with school and other activities?"
  - "What is the NorCal Squash scene like — how big is the junior community?"

