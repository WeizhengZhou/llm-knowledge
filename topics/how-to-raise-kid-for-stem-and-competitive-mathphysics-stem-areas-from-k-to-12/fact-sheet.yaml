# ============================================================================
# MECHANISM OVERREACH FLAGS
# ============================================================================
# These are cross-claim patterns that risk overreach when combined in wiki articles.

mechanism_overreach_flags:

  - flag_id: mof001
    type: "individual_case_to_population"
    claims_involved: [c103, c104]
    description: "Claims about USAMO qualifier acceptance rates at MIT (c103) and admissions impact tiers (c104) risk being combined to imply guaranteed admissions outcomes. Neither claim has institutional backing."
    correction: "Wiki articles must not combine these claims into a narrative about expected admissions outcomes. Each must be individually attributed to its L3/L4 source."

  - flag_id: mof002
    type: "community_feeling_to_established_fact"
    claims_involved: [c109, c119, c120, c124]
    description: "Multiple L4 forum claims about burnout patterns, optimal start ages, and successful trajectories risk being combined into an authoritative-sounding developmental prescription."
    correction: "Wiki articles combining multiple forum observations must maintain L4 attribution on every claim. Do not synthesize forum observations into a single 'recommended pathway' without explicitly noting these are parent-reported patterns, not research-validated findings."

  - flag_id: mof003
    type: "correlation_to_causation"
    claims_involved: [c097, c098, c101]
    description: "Acceleration research claims (effect sizes, SMPY outcomes) are L2-attributed to Davidson reviews. Risk of stating 'acceleration causes better outcomes' without noting these are correlational findings from specific populations."
    correction: "Wiki articles must note that SMPY tracked self-selected participants and that acceleration effect sizes reflect meta-analytic averages across varied contexts. Do not state 'acceleration causes X' — use 'is associated with' or 'research finds.'"

  - flag_id: mof004
    type: "current_observation_to_trend"
    claims_involved: [c106]
    description: "The 83% burnout statistic (c106) from an unidentified survey risks being cited as an established finding. Without methodology details, it cannot support trend claims."
    correction: "Do not use c106 to claim 'burnout is widespread in competition math.' Use it only with full attribution and caveats about unidentified methodology."
