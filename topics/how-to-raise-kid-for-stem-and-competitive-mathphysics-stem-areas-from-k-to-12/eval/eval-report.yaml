      - id: RO1
        job: "Decide whether to pursue competitive STEM at all"
        score: 3
        uncovered_must_answer: []
        notes: >
          is-this-right-for-my-child.md fully covers aptitude signals, personality fit,
          time commitment table by level, benefits beyond admissions, and the ahead-of-grade
          vs. genuine aptitude distinction. Decision framework with 5 steps provided.
          Common Mistakes section is strong and non-obvious.
      - id: RO2
        job: "Build an age-appropriate K-5 foundation for STEM excellence"
        score: 3
        uncovered_must_answer: []
        notes: >
          k12-stem-roadmap K-2 and 3-5 sections cover enrichment by grade band.
          Beast Academy, Singapore Math, and MOEMS recommended with clear rationale.
          "Fostering Mathematical Thinking Without Drilling" subsection directly answers
          the RO2 must_answer about pressure-free enrichment. Enrichment-programs-guide
          adds Kumon/Mathnasium context.
      - id: RO3
        job: "Navigate the competition landscape and choose the right competitions by age"
        score: 3
        uncovered_must_answer: []
        notes: >
          competition-math-pipeline covers AMC 8/10/12, AIME, USAMO, MOP, IMO with
          qualification thresholds, scoring, and dates. physics-competitions-pathway
          covers F=ma, USAPhO, IPhO. amc-competitions covers AMC series plus ARML,
          USAMTS, Math Kangaroo. mathcounts covers MATHCOUNTS and MOEMS. All four
          must_answer items fully addressed.
      - id: RO4
        job: "Select enrichment programs, summer camps, and coaching resources"
        score: 3
        uncovered_must_answer: []
        notes: >
          summer-programs-guide has full comparison table of 10 programs with cost,
          acceptance rate, and fit guidance. enrichment-programs-guide compares AoPS,
          RSM, AwesomeMath, OTIS, Expii with student profile matching table.
          book-resources-by-level organizes books by 4 stages with specific ordering.
          Private coach vs. self-study addressed explicitly in summer-programs-guide.
      - id: RO5
        job: "Manage acceleration decisions"
        score: 3
        uncovered_must_answer: []
        notes: >
          acceleration-decisions covers subject acceleration, grade skipping, dual
          enrollment, and magnet schools (TJHSST, IMSA, Stuy). Research synthesis
          includes meta-analysis of 314 studies and SMPY longitudinal data. Pros/cons
          for each type. Steps section includes long-term planning guidance.
      - id: RO6
        job: "Connect STEM achievements to college admissions strategy"
        score: 2
        uncovered_must_answer:
          - "Direct comparison of competition math vs. research achievements for admissions (USAMO vs. ISEF head-to-head)"
        notes: >
          college-admissions-strategy covers perceived impact by competition level,
          summer program signaling, STS/ISEF timeline, and detailed guidance on where
          to list achievements on applications. However, the article does not provide
          a direct head-to-head comparison of competition math vs. research paths for
          admissions, which parents considering the trade-off need. College admissions
          data is appropriately hedged as L4 (community speculation, not official data).
      - id: RO7
        job: "Prevent burnout and maintain healthy development"
        score: 3
        uncovered_must_answer: []
        notes: >
          burnout-prevention covers warning signs by category, prevalence data (with
          epistemic caveats), prevention strategies, when-to-quit framework with
          frustration vs. disinterest signals, parent behaviors to avoid (8 items)
          and healthy behaviors (5 items). Weekly hours by age covered in the time
          commitment table cross-referenced from is-this-right-for-my-child.
      - id: RO8
        job: "Understand the full cost"
        score: 3
        uncovered_must_answer: []
        notes: >
          cost-and-financial-aid has 4-tier annual cost breakdown ($0-$20K+), specific
          2025-2026 program costs, comprehensive free resources section, financial aid
          strategy with income thresholds, and opportunity cost analysis by competition
          level. Travel costs mentioned.

