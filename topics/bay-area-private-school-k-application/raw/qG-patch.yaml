      - raw/web/authoritative/2026-04-07_parentsleague-progressive-school-fit.md
    notes: >
      "Good fit" = philosophy + child temperament + community alignment (three-way match).
      Progressive schools: value curiosity, self-direction, comfort with ambiguity, parent
      alignment with collaborative ethos.
      Traditional schools: value structure-following, academic readiness signals, parent
      alignment with achievement expectations.
      Gifted programs: value high cognitive engagement, sometimes specific IQ thresholds.
      SF = 7 applicants per opening; developmental readiness prioritized over academics.

