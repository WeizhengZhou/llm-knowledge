guidebook_evaluation:

  chapter_08_financial_aid:
    rating: excellent
    strengths:
      - "Directly addresses Testing Mom anxiety about whether applying for aid hurts chances"
      - "Nueva income brackets are the only concrete data available and are used with full attribution"
      - "Need-blind vs need-aware section is honest about what is confirmed (2 schools) vs community-reported"
      - "4-part financial reality worksheet is the best artifact in the entire guidebook"
      - "9-year commitment framing with 5% escalation math is specific and counterintuitive"
      - "Annual fund described as social expectation, not opt-in -- a non-obvious insight"
      - "Aid application timeline table maps to specific schools and months"
    gaps:
      - "No school-by-school aid generosity comparison beyond Nueva (acknowledged as unknowable)"
      - "Sibling discount section is thin -- only says 'some schools offer' without naming any"
      - "No discussion of outside scholarship sources (e.g., Basic Fund scholarships for qualifying families)"
    evidence_discipline: strong
    evidence_notes: >
      Advisor patterns consistently attributed as advisor-reported, not school policy.
      Nueva brackets sourced to official page. Community guidance (BPN) labeled as
      community guidance. Approximate income brackets explicitly flagged as
      "author extrapolations from a single published case plus advisor inference --
      not published data from individual schools." This is exemplary epistemic
      discipline.

  chapter_11_special_situations:
    rating: excellent
    strengths:
      - "8 self-contained mini-guides with quick-reference index at top"
      - "Learning differences section (Section 3) is sensitive and practical without being legal advice"
      - "Lycee Francais grade-level offset (CP = US 1st grade) is a non-obvious and high-value warning"
      - "Gifted child essay guidance (Section 5) addresses the bragging-vs-description tension directly"
      - "Single-parent section (Section 6) addresses real logistics without being patronizing"
      - "Reapplication section (Section 8) frames developmental change as the key factor"
      - "8 situation-specific checklist cards as an artifact"
    gaps:
      - "No section on bilingual families (e.g., heritage Mandarin speakers applying to CAIS)"
      - "No section on families with multiple children applying to different schools simultaneously"
      - "Section 4 (relocating) could benefit from a Bay Area neighborhood-to-school mapping"
    evidence_discipline: strong
    evidence_notes: >
      TK pipeline question handled with appropriate hedging ("community sources
      describe... no school publicly confirms this as policy"). Disclosure guidance
      attributed to advisors, not presented as legal or medical advice. Reapplication
      patterns attributed to advisors and community forums with explicit "no data
