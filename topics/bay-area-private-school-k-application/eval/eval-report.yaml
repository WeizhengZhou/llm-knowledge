# ============================================================
# D1 — READER OUTCOME ALIGNMENT (per-RO breakdown)
# ============================================================

d1_reader_outcomes:

  - id: RO1
    title: "Navigate the Bay Area private K admissions landscape by region"
    score: 2
    status: fully_enabled
    covered_must_answer:
      - "Which private K schools exist in SF, Peninsula, East Bay, Marin, and South Bay?"
      - "How does the South Bay admissions process differ from SF?"
      - "What is ISSFBA and which schools are members?"
    missing_must_answer: []
    evidence:
      - "overview.md: five-region summary with ISSFBA framework, two assessment models, annual timeline"
      - "school-profiles-sf.md: 11 SF schools with full comparison table"
      - "school-profiles-peninsula-east-bay.md: 6 Peninsula/East Bay/Marin schools with comparison table"
      - "south-bay-schools.md: 7 South Bay schools, explicit SF vs. South Bay comparison table"
      - "issfba-bada.md: coordinated policies, member school count, contract exclusivity"
    notes: "Strongest coverage area. Regional landscape is comprehensive. 3 documented stubs (Redwood Day, Terra SF, EBGIS) do not block RO coverage."

  - id: RO2
    title: "Build and execute an application timeline without missing deadlines"
    score: 2
    status: fully_enabled
    covered_must_answer:
      - "What are the key dates for the 2025-26 admissions cycle (open houses through enrollment)?"
      - "Which schools have December vs. January deadlines?"
      - "When do decisions arrive and how long do families have to respond?"
    missing_must_answer: []
    evidence:
      - "application-timeline.md: month-by-month calendar Sep–Apr, January deadline table (18 schools), financial aid deadline table (10 schools), decision date table (14 schools), enrollment response table (7 schools)"
      - "L1 confidence: 25+ official school sources cross-referenced"
      - "Common mistakes section identifies December wave, decision date exceptions, sibling priority dates"
    notes: "Best single article in the wiki. Decision date exceptions (Live Oak Mar 17, BASIS SV Mar 18, Nueva/Harker/Keys Mar 20) are explicitly documented."

  - id: RO3
    title: "Choose schools that match child and family based on philosophy, assessment, and age"
    score: 2
    status: fully_enabled
    covered_must_answer:
      - "What are the different educational philosophies and which schools follow each?"
      - "Which schools require IQ tests vs. playdates?"
      - "How do age cutoffs vary across schools?"
    missing_must_answer: []
    evidence:
      - "pedagogy-philosophy.md: six philosophy categories, schools mapped, admissions-strategy implications"
      - "assessment-playdate.md: IQ testing vs. playdate format clearly delineated, per-school table"
      - "admissions-strategy.md: comprehensive age-cutoff table (July 15 through December 2), assessment-type list, gender split"
    notes: "Strong triangulation across three articles. Age cutoff table in admissions-strategy.md is particularly actionable."

  - id: RO4
    title: "Understand and navigate financial aid options"
    score: 2
    status: fully_enabled
    covered_must_answer:
      - "How does the Clarity financial aid platform work?"
      - "What tuition ranges and aid participation rates can families expect?"
      - "When are financial aid application deadlines?"
    missing_must_answer: []
    evidence:
      - "financial-aid.md: Clarity mechanics ($65 fee, income-based), indexed/sliding scale tuition model"
      - "financial-aid.md: school-specific data (CDS 30% families, Park Day 45%, SF School 28%, SF Day $28,800 avg adjustment)"
      - "financial-aid.md: deadline table for 10 schools"
      - "public-vs-private.md (guides/): $500K K-12 model, parochial alternatives, Basic Fund"
    notes: "Solid coverage. Long-term cost modeling in public-vs-private.md adds a dimension missing from financial-aid.md alone. South Bay financial aid (Helios, Almaden, Hausner) now covered in south-bay-schools.md."

  - id: RO5
    title: "Prepare for and succeed in assessments and parent interviews"
    score: 1
    status: partial
    covered_must_answer:
      - "What do schools observe during playdates?"
      - "How do IQ tests work, how much do they cost, and when must they be booked?"
    missing_must_answer:
      - "What do parent interviews assess, what questions are typically asked, and how should families prepare?"
      - "Which IQ test providers does Harker require? How far in advance should families book?"
      - "What is the no-coaching rule and why does it matter?"
    evidence:
      - "assessment-playdate.md: playdate format table, what schools observe, WPPSI cost ($850), schools requiring IQ tests"
      - "assessment-playdate.md: parent interview schedule per school (duration, format)"
    gaps:
      - "staging/assessment-prep-critic.md: approved READY by wiki-critic (score 10/10) but not yet promoted to wiki/concepts/assessment-prep.md"
      - "Detailed booking timeline, provider selection, no-coaching warning, and parent interview sample questions are all in the staging article"
      - "Parent interview content in assessment-playdate.md lists schedules but not preparation guidance"
    notes: >
      This is the most consequential gap in the wiki. The assessment-prep staging article
      was approved for promotion but was not promoted before this eval run. Readers
      applying to IQ-testing schools (Harker, Helios, Nueva) face a decision gap:
      they know a test is required and what it costs, but the wiki does not tell them
      when to book, from which providers, or what 'no coaching' means in practice.

  - id: RO6
    title: "Understand special programs (language immersion, gifted, TK)"
    score: 2
    status: fully_enabled
    covered_must_answer:
      - "Which schools offer language immersion and in what languages?"
      - "What is Transitional Kindergarten and should families consider it?"
      - "Which schools are gifted-focused and what scores/assessments do they require?"
    missing_must_answer: []
    evidence:
      - "language-immersion.md: 4 programs profiled (CAIS Mandarin, La Scuola Italian, Lycee French, SVIS French/Mandarin/German)"
      - "language-immersion.md: Lycee age offset (CP requires age 6 by Sep 1) explicitly flagged"
      - "transitional-kindergarten.md: public TK eligibility, private TK comparison table, TK-to-K pipeline question addressed with epistemic note"
      - "pedagogy-philosophy.md: gifted-focused section distinguishes Nueva/Helios from Harker's college-prep"
    notes: "Language immersion coverage is strong. Two stub programs (Terra SF, EBGIS) remain. TK article addresses strategic pipeline question correctly."

