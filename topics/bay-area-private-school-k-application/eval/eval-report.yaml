# D2 — DECISION FRAMING
# ============================================================

d2_decision_framing:
  avg_score: 1.57
  methodology: >
    Each wiki article scored on whether it helps readers make concrete decisions
    (score 2) vs. merely informing them (score 1) or providing no decision guidance (score 0).
    23 articles reviewed.
  per_article_scores:
    application-timeline: 2
    financial-aid: 2
    admissions-strategy: 2
    assessment-playdate: 2
    south-bay-schools: 2
    pedagogy-philosophy: 2
    transitional-kindergarten: 2
    language-immersion: 2
    public-vs-private: 2      # UPGRADED from 1: decision framework now has explicit if/then logic
    admissions-strategy-advanced: 2  # NEW: reach/match/safety framework, waitlist action steps
    financial-realities: 2    # NEW: explicit when-to-pursue-private decision framework
    parent-essay-guide: 2     # NEW: which challenge to disclose, essay selection logic
    assessment-prep: 2        # NEW: booking timeline decisions, which test applies to child's age
    overview: 1               # Navigational; provides orientation not decision logic
    school-profiles-sf: 1     # Entity profiles; appropriately informational
    school-profiles-peninsula-east-bay: 1
    harker-school: 1
    challenger-school: 1
    stratford-school: 1
    issfba-bada: 1
    ravenna-hub: 1
    school-tour-guide: 1      # NEW: what to observe, questions to ask — informational
    # 13 score 2, 10 score 1 = (13*2 + 10*1)/23 = 36/23 = 1.565
  notes: >
    public-vs-private upgraded from 1 to 2 following the addition of an explicit
    'When to Pursue Private K' section with if/then decision logic. The four new
    guides articles all provide decision-oriented content. Entity profile articles
    (school profiles, harker, challenger, stratford, issfba-bada, ravenna) remain
    appropriately informational — decision framing lives in the guide articles. The
    school-tour-guide is richer in observational guidance than decision logic (score 1).

# ============================================================
# D3 — COMMON MISTAKES QUALITY
# ============================================================

d3_common_mistakes_quality:
  avg_score: 1.75
  new_high_quality_mistakes_this_cycle:
    - article: concepts/assessment-prep
      mistake: "Coaching for IQ tests at Helios and Harker invalidates results and disqualifies applications — both schools state this explicitly. Parents who intuitively try to 'prepare' their child for a cognitive test actively harm the application. Booking by September-October is a counterintuitive time constraint for families focused on January deadlines."
      quality: high
      status: was flagged in previous eval as existing in staging; now promoted to wiki
    - article: guides/financial-realities
      mistake: "Evaluating only one year of tuition understates the K-12 commitment by 13x; 4-6% annual escalation means $45,000 kindergarten becomes ~$80,000 by 8th grade."
      quality: high
    - article: guides/public-vs-private
      mistake: "Treating private school as all-or-nothing: parochial schools at $6,000-$10,000/year represent a 75-85% cost reduction vs. independent schools, not often surfaced in SF private school research."
      quality: medium
    - article: guides/admissions-strategy-advanced
      mistake: "Working parents often over-invest in optional open houses when strategic attendance (required events only + tours) yields similar outcomes. Missing optional events does not hurt applications per Head-Royce."
      quality: medium
  standout_non_obvious_mistakes_cumulative:
    - article: application-timeline
      mistake: "December deadline wave (Head-Royce Dec 5, C&SH Dec 12, SF Friends/SF Day Dec 19, MCDS Dec 28) missed by families assuming all ISSFBA schools have January deadlines"
      quality: high
    - article: application-timeline
      mistake: "Sibling priority deadlines (October) are 2-3 months before general deadlines"
      quality: high
    - article: admissions-strategy
      mistake: "First-choice letters and letters of recommendation carry no advantage at ISSFBA member schools"
      quality: high
    - article: financial-aid
      mistake: "Sticker price ≠ typical cost at indexed-tuition schools (CDS: $3,500-$48,895; Park Day: $1,900-$37,980)"
      quality: high
    - article: south-bay-schools
      mistake: "Tuition comparison without scope: Harker $51,550 includes lunch, care, shuttles"
      quality: high
    - article: concepts/assessment-prep
      mistake: "IQ test coaching invalidates results and disqualifies Harker application"
      quality: high
  articles_lacking_common_mistakes:
    - overview     # Navigational; delegated
    - ravenna-hub  # Utility article
    - issfba-bada  # Policy reference
    - school-tour-guide  # Has observational guidance but no formatted mistakes section

