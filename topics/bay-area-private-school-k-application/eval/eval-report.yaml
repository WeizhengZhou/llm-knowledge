          blank. Estimate ~75% entity completeness.
        entity_completeness: 0.75
      D2c_stub_ratio:
        score: 2
        notes: >
          Wiki _index.md lists EBGIS, Burke's, and several others as stubs.
          Ch 12 "What's Not in This Directory" acknowledges Redwood Day,
          Waldorf/Montessori schools, and most parochial schools as uncovered.
          Estimated 15-20% stub ratio across all tracked entities.
        stub_ratio: 0.18
