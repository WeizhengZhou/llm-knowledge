    weight: 0.30
    score: 2.71
    weighted: 27.1
    per_outcome:
      - id: RO1
        job: "Navigate the Bay Area private K admissions landscape by region"
        score: 3
        uncovered_must_answer: []
        evidence: >
          Ch 12 directory covers SF (11 schools with table), Peninsula/East Bay
          (6 schools), Marin (2 schools), South Bay (6 schools). Wiki profiles
          add depth. Specialty indices (IQ-testing, immersion, rolling) at end
          of Ch 12. Ch 02 Three Systems table distinguishes SF playdate vs
          IQ-testing vs South Bay rolling. Complete regional coverage.

      - id: RO2
        job: "Build and execute an application timeline without missing deadlines"
        score: 3
        uncovered_must_answer: []
        evidence: >
          Ch 02 Year at a Glance is the strongest single chapter. Six-track
          parallel timeline table (school research, recs, IQ testing, applications,
          playdates, financial aid). Month-by-month detail May through August.
          December deadline wave explicitly flagged (Hamlin, SF Friends, SF Day,
          C&SH). Decision date matrix in Ch 10. Wiki application-timeline.md
          provides structured tabular backup.

      - id: RO3
        job: "Choose schools based on philosophy, assessment, and age"
        score: 3
        uncovered_must_answer: []
        evidence: >
          Ch 03 What Schools Evaluate covers playdate vs IQ fork clearly.
          Assessment format table with 10 schools. Wiki pedagogy-philosophy.md
          covers 6 philosophy categories. Ch 12 directory tables include age
          cutoffs for every school. Ch 01 frames the decision itself (public
          vs private). Age cutoff table spans wiki admissions-strategy.md and
          directory.

      - id: RO4
        job: "Understand and navigate financial aid options"
        score: 3
        uncovered_must_answer: []
        evidence: >
          Ch 08 is the standout chapter for this RO. Covers: Clarity mechanics
          (what it asks for, when portal opens), Nueva's published income brackets
          (the only concrete data available), need-blind vs need-aware distinction
          with confirmed schools (Nueva, Almaden), aid timeline table (Sep-Mar),
          4-part financial reality worksheet (annual true cost, aid estimate,
          9-year picture, comparison). Wiki financial-aid.md and
          guides/financial-realities.md provide backup. The need-blind/need-aware
          question was NOT covered in prior evals -- Ch 08 handles it directly
          and honestly.

      - id: RO5
        job: "Prepare for assessments, interviews, essays, and recommendations"
        score: 3
        uncovered_must_answer: []
        evidence: >
          Ch 03 (what schools evaluate), Ch 04 (IQ testing demystified with
          decision tree flowchart), Ch 05 (preparing child without over-preparing
          with CDC milestones), Ch 06 (recommendation letters -- September signal,
          ISSFBA form, logistics), Ch 07 (application as logistics operation,
          Ravenna vs school-specific portals, essay guidance). Wiki
          concepts/assessment-prep.md adds IQ booking timeline and cost data.
          This RO is comprehensively covered across 5 guidebook chapters.

      - id: RO6
        job: "Understand special programs (language immersion, gifted, TK)"
        score: 3
        uncovered_must_answer: []
        evidence: >
          Ch 11 Section 1 (TK question with public/private/redshirting framework),
          Ch 11 Section 2 (language immersion with Lycee grade-level offset warning),
          Ch 11 Section 5 (gifted child at observation-based schools), Ch 04
          (IQ-testing schools detailed), Ch 12 specialty indices (IQ-testing,
          immersion). Wiki language-immersion.md and transitional-kindergarten.md
          provide backup.

      - id: RO7
        job: "Handle decision day, waitlists, rejection, and special situations"
        score: 2
        uncovered_must_answer:
          - "Feeder preschool patterns -- which preschools are known feeders to which schools"
          - "Consultant value -- should families hire an admissions consultant, and what do they cost"
        evidence: >
          Ch 10 is excellent: 4 scenarios (one offer, multiple offers, waitlisted,
          no offers), decision-day response matrix, post-decision action timeline,
          multiple-offer comparison framework, emotional architecture section.
          Ch 11 covers 8 special situations with checklist cards. However: the
          frequently asked questions about feeder preschools (which preschools
          give an advantage?) and admissions consultants (are they worth it?) are
          not addressed in any chapter or wiki article. These are high-anxiety
          questions for the Testing Mom persona.

  D2_coverage:
    weight: 0.20
    score: 2.33
    weighted: 15.6
    sub_scores:
      D2a_topic_coverage:
        score: 3
        notes: >
          All major decision categories have dedicated content. Category A
          (pre-decision: should I even do this?) covered by Ch 01. Category B
          (experiential: what actually happens) covered by Ch 03, 05, 09, 10.
          Category C (lifecycle: what happens after?) covered by Ch 10, Ch 11
          Section 8 (reapplication). No major decision category missing.
      D2b_entity_coverage:
        score: 2
        notes: >
          Ch 12 directory covers ~20 schools with individual profiles. However,
          SF comparison table has 6 of 11 schools with missing tuition data
          (--). Convent & Stuart Hall, La Scuola, Hamlin, Live Oak, Presidio
          Hill, SF Friends all missing tuition in wiki table. Ch 12 directory
