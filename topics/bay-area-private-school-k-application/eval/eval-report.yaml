  avg_score: 1.833

# ============================================================
# D2 — DECISION FRAMING
# ============================================================

d2_decision_framing:
  avg_score: 1.50
  methodology: >
    Each wiki article scored on whether it helps readers make concrete decisions
    (score 2) vs. merely informing them (score 1) or providing no decision guidance (score 0).
  per_article_scores:
    application-timeline: 2
    financial-aid: 2
    admissions-strategy: 2
    assessment-playdate: 2
    south-bay-schools: 2
    pedagogy-philosophy: 2
    transitional-kindergarten: 2
    language-immersion: 2
    public-vs-private: 1  # critic noted D2=1; decision path present but not structured
    overview: 1           # navigational; provides orientation but not decision logic
    school-profiles-sf: 1 # entity profiles; informational tables
    school-profiles-peninsula-east-bay: 1
    harker-school: 1
    challenger-school: 1
    stratford-school: 1
    issfba-bada: 1
    ravenna-hub: 1
  notes: >
    Entity profile articles (school profiles, harker, challenger, stratford, issfba-bada,
    ravenna) are appropriately informational — they feed into admissions-strategy.md where
    the decision framing lives. The split is by design but lowers the average. The guide
    articles (application-timeline, financial-aid, admissions-strategy) are strongly decisional.

# ============================================================
# D3 — COMMON MISTAKES QUALITY
# ============================================================

d3_common_mistakes_quality:
  avg_score: 1.65
  standout_non_obvious_mistakes:
    - article: application-timeline
      mistake: "December vs. January wave not intuitive — families assume all ISSFBA schools have January deadlines, missing Head-Royce (Dec 5), C&SH (Dec 12), SF Friends/SF Day (Dec 19), MCDS (Dec 28)"
      quality: high
    - article: application-timeline
      mistake: "Sibling priority deadlines (October) are months before general deadlines (January) — not obvious to first-time applicants"
      quality: high
    - article: admissions-strategy
      mistake: "First-choice letters and letters of recommendation provide no ISSFBA member school advantage (Hamlin confirmed explicitly) — counter to applicant instinct"
      quality: high
    - article: admissions-strategy
      mistake: "Age cutoff variation means a child eligible at one school may not qualify at another — not obvious to parents who assume SF/CA standard applies everywhere"
      quality: high
    - article: financial-aid
      mistake: "Sticker price ≠ typical cost — schools with indexed tuition (CDS: $3,500-$48,895; Park Day: $1,900-$37,980) appear more expensive than they are for many families"
      quality: high
    - article: south-bay-schools
      mistake: "Tuition comparison without scope — Harker's $51,550 includes lunch, care, shuttles; other schools charge separately, making direct comparison misleading"
      quality: high
    - article: south-bay-schools
      mistake: "Rolling admissions at Challenger/Stratford does not mean unlimited availability — classes fill, early submission is recommended"
      quality: medium
    - article: assessment-playdate
      mistake: "Coaching for IQ tests has no benefit and may disqualify the application at Harker (explicitly stated on their admissions page) — highly counterintuitive"
      quality: high  # Note: full treatment in staging/assessment-prep.md not yet promoted
    - article: pedagogy-philosophy
      mistake: "Gifted-focused (Nueva/Helios) vs. traditional-selective (Harker) — parents may misapply IQ prep to all cognitive-assessment schools"
      quality: medium
  articles_lacking_common_mistakes:
    - overview      # Navigational; delegated to individual articles
    - ravenna-hub   # Utility article; no mistakes relevant
    - issfba-bada   # Entity; policy reference
    - language-immersion  # Key considerations section present but not formatted as mistakes

# ============================================================
# D4 — L4 SYNTHESIS PRESENCE
# ============================================================

d4_l4_synthesis:
  avg_score: 1.70
  epistemic_note_blocks_found:
    - article: admissions-strategy
      blocks: 3
      quality: "Well-calibrated — consultant content clearly attributed to admissions consulting firms and community blog (Ruth Krishnan); $3K-$15K consultant estimate flagged as unverified"
    - article: transitional-kindergarten
      blocks: 1
      quality: "TK-to-K pipeline note is precise — distinguishes program structure (observed) from priority policy (unconfirmed)"
    - article: assessment-playdate
      blocks: 1
      quality: "Neuropsychologist data (20% of clients score ≥130) correctly flagged as self-selected sample, not population data"
    - article: public-vs-private
      blocks: 1
      quality: "Basic Fund data flagged as partially-fetched source; inline disclaimer for public school quality sentence is awkward (not in proper note block)"
    - article: south-bay-schools
      blocks: 0
      quality: "L3 sources (aggregator tuition for Challenger ~$12,000, BASIS SV ~$39,795) are flagged inline with '(L3, undated)' and '(L3, unconfirmed)' in comparison table — good inline approach"
    - article: school-profiles-sf
      blocks: 0
      quality: "PrivateSchoolReview acceptance rates consistently flagged as 'school-wide, not K-specific, methodology undisclosed' — correct inline treatment"
  gaps:
    - article: language-immersion
      issue: "La Scuola ~80% Italian / 20% English split cited as 'prior research' without epistemic note block — should be L3 or L4 with note"
    - article: overview
      issue: "Community signal about parent experience absent — could benefit from one synthesized note on what forum discussions reveal about competitive dynamics vs. official description"

# ============================================================
# D5 — SCOPE DISCIPLINE
# ============================================================

d5_scope_discipline:
  avg_score: 1.90
  notes: >
    Wiki articles stay within declared scope with consistent cross-linking rather than
    content duplication. Entity profiles correctly defer strategy content to
    admissions-strategy.md. School profiles defer IQ testing logistics to
    assessment-playdate.md. No article shows meaningful scope creep.
  minor_issues:
    - article: school-profiles-peninsula-east-bay
      issue: "Harker School appears in the comparison table with a full profile link, but Harker is a South Bay school. Minor geographic scope question — managed via explicit footnote."
    - article: pedagogy-philosophy
      issue: "Deadline pattern observation (progressive vs. traditional timing correlation) is a slight conceptual stretch and is correctly flagged as a small-sample observation."

# ============================================================
# D6 — SOURCE DIVERSITY
# ============================================================

d6_source_diversity:
  avg_score: 1.70
  source_tiers_present:
    L1_official_school_sources: true
    L2_news_aggregator_journalism: true  # KQED, SF Standard, Cardinal Education
    L3_aggregator_review_platforms: true  # PrivateSchoolReview, TestingForKindergarten, Niche
    L4_community_forum: true             # Ruth Krishnan blog, feeder preschool community source
  tier_distribution_by_article:
    application-timeline: "L1 dominant (25+ school sources), L2 supplementary (Cardinal Education)"
    financial-aid: "L1+L2, Redwood Grove WM (L3 wealth management blog)"
    admissions-strategy: "L1+L2+L4 (well-balanced, appropriately marked)"
    assessment-playdate: "L1+L2+L3 (SF Standard, Cardinal Education)"
    school-profiles-sf: "L1+L3 (PrivateSchoolReview)"
    south-bay-schools: "L1+L2+L3 (SF Standard, TestingForKindergarten)"
    language-immersion: "L1+L2"
    issfba-bada: "L1 only"
    ravenna-hub: "L1 only"
  notes: >
    Source diversity is adequate across the wiki as a whole. Individual articles that
    cover procedural/official data (issfba-bada, ravenna-hub) correctly rely on L1 only.
    Key guide articles (admissions-strategy, assessment-playdate) demonstrate all relevant
    tiers. Community signal (L4) is present but thin — primarily one blog source
    (Ruth Krishnan) for all L4 content. A Reddit/forum synthesis article covering
    parent community patterns would substantially improve D6.

