      staging/assessment-prep.md (approved READY, not yet promoted).

  - id: TQ14
    ro: RO6
    question: "My family wants Mandarin immersion — what are our options and do we need prior Mandarin knowledge?"
    score: 2
    notes: "Fully answerable. language-immersion.md: CAIS (no prior Mandarin required at K entry, $46,300 tuition, Jan 16 deadline) and SVIS ($42,630, Jan 13 deadline, French/Mandarin/German tracks). school-profiles-sf.md has CAIS full profile."

  - id: TQ15
    ro: RO6
    question: "Should I enroll my child in public TK or private TK, and does TK at Harker give priority for kindergarten admission?"
    score: 2
    notes: >
      Fully answerable. transitional-kindergarten.md: public TK is free and guaranteed;
      private TK at Harker ($46,350) vs. other schools. The TK-to-K pipeline question
