      - "Feeder preschool patterns (which preschools are known pipelines to which schools)"
      - "Admissions consultant ecosystem (when worth hiring, typical costs, what they do)"
      - "Burke's School -- mentioned in landscape.yaml but no profile in wiki or directory"

  D3_accuracy:
    weight: 0.20
    score: 2.00
    weighted: 13.3
    sub_scores:
      D3a_attribution_compliance:
        score: 3
        notes: >
          Guidebook chapters consistently use attribution: "According to SF Day
          School," "According to Harker," "advisors who work with Bay Area
          families report," "community sources report." Sampled 20 claim
          sentences across Ch 08, Ch 11, Ch 12. 19/20 had proper attribution
          or epistemic hedging. The one exception was the Lycee Francais tuition
          range (~$35,900-$45,900) which used "approximately" without source
          attribution but was qualified with the cycle year.
      D3b_confidence_level_discipline:
        score: 2
        notes: >
          No L5 claims in guidebook or wiki. L4 community sources consistently
          hedged ("advisors who work with Bay Area families report," "some
          parents on Berkeley Parents Network report"). However, the wiki has
          two active lint errors: E006 (Harker tuition contradiction: $47,400
          vs $51,550) and E007 ($520K unverifiable figure in
          financial-realities.md). These are factual integrity issues that
          prevent a score of 3. The guidebook Ch 08 correctly uses $51,550 for
          Harker -- the contradiction is wiki-only.
      D3c_conflict_documentation:
        score: 1
        notes: >
          The fact-sheet documents disputes (d001: SF Day aid deadline Jan 12 vs
          Jan 13; d006: $520K figure not on live page). But these conflicts are
          not surfaced in wiki articles or guidebook chapters in a way readers
          can see. The SF Day deadline discrepancy is silently resolved to
          Jan 12 in the guidebook. The Harker tuition contradiction (E006) is
          not documented as a conflict -- it's just wrong in one place. No
          claims/ dispute article exists for any identified conflict.

  D4_actionability:
    weight: 0.15
    score: 2.67
    weighted: 13.3
    sub_scores:
      D4a_decision_framing:
        score: 3
        notes: >
          The guidebook is exceptional at decision framing. Ch 01 uses explicit
          if/then logic for the private-vs-public decision. Ch 04 opens with a
          decision tree flowchart. Ch 08 includes a 4-part financial reality
          worksheet. Ch 10 has a 5-scenario decision response matrix. Ch 11
          has 8 situation-specific quick-reference checklist cards. Every chapter
          tells readers what to DO, not just what to know.
      D4b_common_mistakes_quality:
        score: 3
        notes: >
          Non-obvious, specific mistakes throughout. Examples: December deadline
          wave missed by families assuming January (Ch 02). IQ test coaching
          disqualifies Harker application (Ch 04). Lycee Francais CP = US 1st
          grade, not K (Ch 11). MCDS has separate Feb 1 teacher evaluation
          deadline after Dec 28 application (Ch 12). Annual fund as a strong
          social expectation, not a true opt-in (Ch 08). The September signal
          for recommendation letters (Ch 06). These are specific,
          counterintuitive, and decision-critical.
      D4c_entry_point_clarity:
        score: 2
        notes: >
          Guidebook has clear sequential structure (Ch 01-12). A reader who
          starts at Ch 01 will navigate correctly. Ch 11 has an excellent
          quick-reference index table. However, wiki overview.md does not link
          to the guidebook chapters, and the wiki itself has navigation issues
          (E008: four guide articles listed as staging in _index.md, broken
          wikilinks in E001-E004). A reader landing on the wiki first would not
          find the guidebook easily.

  D5_perspective_balance:
    weight: 0.10
    score: 2.00
    weighted: 6.7
    sub_scores:
      official_school_sources: true
      aggregator_review_data: true  # Cardinal Education, PrivateSchoolReview, SF Standard
      community_parent_synthesis: partial  # BPN referenced, Ruth Krishnan blog, but thin
      expert_synthesis: true  # Admissions advisors, financial advisors consistently cited
      counterarguments: true  # Ch 01 explicitly argues against private school myths
    notes: >
      Guidebook is stronger than wiki on perspective balance. Ch 01 explicitly
      includes "what tends to sound right but often isn't" (better outcomes,
      better teachers, the network). Ch 08 includes "if the numbers don't work"
      with public school as legitimate option. Ch 10 has "no offers" scenario
      treated with full dignity. However, L4 community signal remains thin --
      primarily one blog (Ruth Krishnan) and BPN. No Reddit, UrbanBaby, or
      SFGATE parent forum synthesis. No counterargument article on "why NOT to
      hire a consultant" or "why feeder preschool patterns may be overblown."

  D6_navigability:
    weight: 0.05
    score: 1.25
    weighted: 2.1
    sub_scores:
      broken_wikilinks:
        score: 0  # E001-E004: 8+ broken wikilinks across 7 articles
      orphaned_articles:
        score: 1  # W001-W003: 5 orphaned articles (4 guides + assessment-prep)
      backlinks_populated:
        score: 2  # Most articles have backlinks; 4 new guides have empty backlinks
      see_also_sections:
        score: 2  # Most articles have See Also; new guides have broken references
    notes: >
      Lint report 2026-04-07 found 8 errors including broken wikilinks (E001-E004),
      stale cycle_bound article (E005), tuition contradiction (E006), unverifiable
      figure (E007), and index out of sync (E008). 11 warnings. The guidebook
      itself has good internal navigation (chapter cross-references, "see Chapter X"
      throughout). The wiki structural issues are real and unfixed.

