    ro: RO1
    question: "How does the South Bay private K admissions process differ from San Francisco?"
    score: 2
    notes: "Fully answerable. south-bay-schools.md has an explicit 7-attribute comparison table (ISSFBA coordination, decision dates, deadlines, assessment model, platform, multi-campus presence, tuition range)."

  - id: TQ03
    ro: RO1
    question: "What is ISSFBA/BADA and how does the coordinated March 19 decision date work?"
    score: 2
    notes: "Fully answerable. issfba-bada.md covers founding, member schools, coordinated notification dates, contract exclusivity, shared evaluation form, no first-choice pressure policy."

  - id: TQ04
    ro: RO2
    question: "What is the month-by-month admissions calendar for the 2025-26 cycle?"
    score: 2
    notes: "Fully answerable. application-timeline.md has Sep–Apr month-by-month table with specific dates for each phase."

  - id: TQ05
    ro: RO2
    question: "Which schools have December deadlines rather than January deadlines?"
    score: 2
    notes: "Fully answerable. application-timeline.md December row explicitly names Head-Royce (Dec 5), C&SH (Dec 12), SF Friends/SF Day (Dec 19), Marin Country Day (Dec 28). Common mistakes section reinforces."

  - id: TQ06
    ro: RO2
    question: "My child was accepted on March 19 — how long do I have to accept and what happens if I'm waitlisted at another school?"
    score: 2
    notes: "Fully answerable. application-timeline.md has enrollment response table (March 24-26 by school). issfba-bada.md explains contract exclusivity and waitlist timing. admissions-strategy.md covers active waitlist strategy."

  - id: TQ07
    ro: RO3
    question: "My child has an October birthday — which schools would they be age-eligible for?"
    score: 2
    notes: "Fully answerable. admissions-strategy.md has complete age cutoff table with all cutoffs from July 15 (C&SH, Town School) through December 2 (Challenger, Stratford). October birthday → eligible at schools with Sep 1 or later cutoff but not July 15 or Aug 1 schools."

  - id: TQ08
    ro: RO3
    question: "What is the difference between a progressive school and a traditional school, and which Bay Area private K schools are in each category?"
    score: 2
    notes: "Fully answerable. pedagogy-philosophy.md has philosophy comparison table and dedicated sections for progressive (CDS, Live Oak, SF Friends, Park Day, Presidio Hill) and traditional (Harker, Challenger, Stratford) with admissions characteristics for each."

  - id: TQ09
    ro: RO3
    question: "I want to avoid IQ testing. Which schools use playdates instead, and what do those playdates assess?"
    score: 2
    notes: "Fully answerable. assessment-playdate.md clearly delineates playdate vs. IQ schools, per-school format table, and what schools observe (social-emotional readiness, motor skills, curiosity, adaptability). SF Standard source confirms SF city schools do not require IQ tests."

  - id: TQ10
    ro: RO4
    question: "How does the Clarity financial aid platform work and what is the typical timeline for applying?"
    score: 2
    notes: "Fully answerable. financial-aid.md covers Clarity platform mechanics ($65 fee, income-based calculation), 10 school-specific deadlines, and how schools set individual tuition from Clarity assessment."

  - id: TQ11
    ro: RO4
    question: "What percentage of families receive financial aid and what is the actual tuition range I might pay at SF Day, CDS, or Park Day?"
    score: 2
    notes: "Fully answerable. financial-aid.md: SF Day (avg adjustment $28,800, min 5% contribution), CDS (30% of students, $3,500-$48,895 range), Park Day (45% of families, $1,900-$37,980). All school-specific and sourced to official pages."

  - id: TQ12
    ro: RO5
    question: "My child is applying to Nueva School. What IQ test is required, how much does it cost, and when should I book?"
