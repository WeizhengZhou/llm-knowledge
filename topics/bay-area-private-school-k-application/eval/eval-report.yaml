    - article: guides/admissions-strategy-advanced
      blocks: 2
      quality: "Application volume guidance sourced from consultants (L3-L4), not schools. Working parent event-load estimate (20-35 events) attributed to one consultant (Ruth Krishnan L4) with explicit count-variability caveat."
    - article: guides/financial-realities
      blocks: 1
      quality: "Lifetime cost ($520K vs $500K-$700K) correctly noted as modeled projection, not surveyed statistic."
    - article: guides/parent-essay-guide
      blocks: 1
      quality: "Essay evaluation criteria sourced from consulting firms (L3), not school admissions officers. Unusually consistent across three sources noted as plausibility signal without overstating confidence."
  persistent_gaps:
    - article: language-immersion
      issue: "La Scuola ~80% Italian / 20% English instruction split cited as 'prior research' without an epistemic note block — should be an L3 note. Gap persists from previous eval."
    - article: overview
