      - value: "January 12"
        source: "sfday.org/admission/how-to-apply-key-dates"
        tier: L1-official
        date: "2026-04-06"
        note: "Key dates page lists Jan 12 as financial aid deadline."
      - value: "January 13, 2026"
        source: "sfday.org/admission/tuition-adjusted-tuition"
        tier: L1-official
        date: "2026-04-06"
        note: "Tuition page lists Jan 13 as general deadline."
      - value: "January 12 (new families); January 13 (general/returning)"
        source: "sfday.org/admission/tuition-adjusted-tuition (live fetch 2026-04-06)"
