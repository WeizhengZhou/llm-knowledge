    discovered_from: landscape_scan
    evolution_run: 2026-04-07
    landscape_seed: qs4
    notes: >
      Schools look for egregious signs, not perfection. Evaluate: social skills (sharing, taking turns, peer engagement),
      emotional regulation (managing frustration, transitions), problem-solving, instruction-following, curiosity.
      NOT evaluated: academic skills (reading, counting), physical appearance, parent behavior (in playdate room).
      Red flags: extreme separation anxiety that does not resolve; inability to follow simple instructions; prolonged unrecoverable meltdowns;
      persistent aggressive behavior toward other children; severe social withdrawal.
      Coaching backfires: children who sound rehearsed or robotic are flagged — schools prefer authentic behavior.
      Most children pass playdates; red flags are exceptional cases, not marginal ones.
      Preparation advice: maintain regular routines day of; child should be rested and fed; explain "you're going to play with some new friends."

