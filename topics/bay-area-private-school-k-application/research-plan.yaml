    discovered_from: gap_analysis
    children: []
    notes: >
      National standard (PrivateSchoolReview): sibling preference is priority, not a guarantee. Siblings must meet academic/behavioral/developmental standards.
      Preference varies by school and grade level; competitive entry points (i.e., kindergarten) may limit sibling placements.
      Bay Area-specific (community source, Paula Molligan): schools "do have strong sibling policies... it's not automatic, but there is a strong policy for acceptance."
      Cypress School SF (official): siblings receive "top priority consideration" but admission is "not a guarantee."
      Sibling discounts: 5-15% off tuition nationally; fewer schools offering automatic discounts in 2025.
      Best timing: applying at natural expansion grades (kindergarten, grade 6, grade 9) increases sibling success.
      No SF private school publicly discloses the exact weight given to sibling status in their admissions rubric.

