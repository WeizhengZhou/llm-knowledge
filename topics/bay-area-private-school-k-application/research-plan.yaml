    discovered_from: gap_analysis
    children: []
    notes: >
      ISSFBA official 2025-26 K-8 notification dates: electronic March 19 2026, family response due March 26 2026.
      Preschool/TK/JK: electronic March 11, response due March 17.
      Waitlist mechanism: once a family signs with one ISSFBA school, other ISSFBA schools "do not typically offer a contract."
      This means waitlists move primarily in the week between notification (March 19) and response deadline (March 26).
      After response deadline, families should contact waitlisted schools directly — some schools keep active waitlists, others close them.
      Schools consider zip code, cultural/ethnic/socioeconomic diversity when filling waitlist spots (community source).

  - id: QG003
    facet: HOW
    phase: gap_fill
    text: "How strong is sibling preference at Bay Area private K schools — does it effectively guarantee admission, and what are the conditions and exceptions?"
    scores:
