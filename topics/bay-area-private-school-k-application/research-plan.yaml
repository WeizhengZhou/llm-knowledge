      - id: s-2026-04-07-070
        query: "private school kindergarten waitlist concrete steps improve chances letter of continued interest LOCI Bay Area 2025"
    raw_files:
      - raw/web/community/2026-04-07_bpn-rejection-next-steps-reapplication.md
      - raw/web/news/2026-04-07_waitlist-strategy-concrete-steps.md
    discovered_from: landscape_scan
    evolution_run: 2026-04-07
    landscape_seed: qs6
    notes: >
      ISSFBA peak waitlist window: March 19 (notification) to March 26 (response deadline) — families with multiple acceptances choose one, releasing others.
      Secondary movement: through June; late movement through August (last-minute withdrawals before school starts).
      Acceptance rates from waitlist: 5-15% at highly selective schools; 15-30% at less competitive selective schools.
      Four concrete steps:
        1. Confirm immediately — lack of response may result in removal.
        2. Send Letter of Continued Interest (LOCI): reaffirm first-choice status (if true); add new information; explain specific fit. One thoughtful letter beats repeated messages.
        3. Ask strategic questions: is the waitlist ranked or pooled? Typical decision timeline? Shows genuine engagement.
        4. Attend any invited events — demonstrates commitment.
      What NOT to do: do not pester staff with repeated calls/emails; do not threaten to withdraw.
      Signal interpretation: if admissions director tells you to accept elsewhere, interpret as soft rejection.
      Maintain deposit at accepted school while on waitlist; forfeiting deposit if waitlist offer arrives is expected and acceptable.
      Schools fill waitlist spots based on class composition needs: underrepresented zip codes, diversity, gender balance.
