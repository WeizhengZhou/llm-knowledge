    notes: >
      Total K-12 private cost per child in Bay Area: approximately $500,000-$700,000.
      Public school quality varies by district: Palo Alto, Berkeley, Piedmont strong; SFUSD more variable.
      SFUSD lottery uncertainty (public school assignment by lottery in SF) drives private applications as hedge.
      Key decision factors: financial capacity; educational philosophy fit; public school alternative quality; class size preferences; sibling continuity planning.
      ISSFBA recommends: complete financial analysis BEFORE applying to any private schools.
      Public schools: more ethnic/socioeconomic diversity on average.
      Private schools: smaller classes, more resources, enrichment options, extended care.
