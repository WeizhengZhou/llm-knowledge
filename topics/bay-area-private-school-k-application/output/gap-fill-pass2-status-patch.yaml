      IQ Testing Providers:
        Shelley Sinclair, LEP (Los Altos): $950 per assessment; WISC-V and WPPSI-IV; bayareaiqtest.com; (650) 204-0542.
        Dr. Ginny Estupinian, PhD ABPP (Los Gatos): approximately $850; serves Nueva, Helios, Harker families.
