  - id: d001
    claim_ids: [c010]
    subject: "SF Ballet Company dancers who are school alumni percentage"
    positions:
      - value: "over 70%"
        source: sfballet.org/the-school/tuition/
        tier: L1-official
        date: 2026-04-22
        note: "Appears in 'About the School' section of tuition page"
      - value: "Nearly 70%"
        source: sfballet.org/school/
        tier: L1-official
        date: 2026-04-22
        note: "Appears in 'Training Tomorrow's Professionals' section"
    resolution: "Both pages are official L1 from the same institution. The difference is minor (over vs. nearly 70%) and likely reflects rounding or page update timing. The school programs overview page was confirmed via live fetch to say 'nearly 70%'. Use hedged 'approximately 70%' language."
    permitted_language: "According to SF Ballet's website, approximately 70% of SF Ballet Company dancers trained through the School's programs (the tuition page states 'over 70%' while the school overview page states 'nearly 70%')"
    confidence: L2

  - id: d002
