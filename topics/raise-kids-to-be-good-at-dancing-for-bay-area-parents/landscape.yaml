common_pain_points:
  - "How much does competitive dance actually cost? (Parents report $2,500-$9,000/year for competitions alone, not including tuition)"
  - "My kid wants to do competitive dance but I'm worried about burnout (10-30 hours/week rehearsal)"
  - "How do I tell a good dance studio from a bad one? What are the red flags?"
  - "Is my child too young/too old to start dance? What's the right age for ballet vs hip-hop?"
  - "What's the difference between recreational and competitive dance programs?"
  - "How do I protect my child from hypersexualization in dance (costumes, choreography)?"
  - "Are there dance classes specifically welcoming to boys in the Bay Area?"
  - "What does a pre-professional ballet path actually look like and is my kid good enough?"
  - "Can my kid get a college scholarship for dance? Is it worth pursuing?"
  - "How do I balance dance with school, other activities, and family time?"
  - "Which Bay Area studios are best for beginners vs serious dancers?"
  - "What should I expect at my child's first dance class?"
  - "Summer intensives - are they worth it and which ones are good?"
  - "My child loves dancing but I can't afford expensive studios - what are the affordable options?"

preliminary_question_seeds:
  - text: "How much does competitive dance cost annually including hidden fees?"
    source: "danceparent101.com, scarymommy.com"
    urgency: high
  - text: "What are red flags when evaluating a dance studio for children?"
    source: "danceawareness.com, kickdancestudios.com"
    urgency: high
  - text: "What is the realistic timeline from beginner to pre-professional?"
    source: "sfballet.org, cityballetsf.org"
    urgency: high
  - text: "Which Bay Area studios are best for specific age groups and styles?"
