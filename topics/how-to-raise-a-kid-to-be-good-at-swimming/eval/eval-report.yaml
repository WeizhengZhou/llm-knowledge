      - "Category C gap: No article on nutrition for young swimmers (mentioned as gap in lint report CV2 notes)"
    entity_completeness: 0.80
    stub_ratio: 0.0
    notes: >
      D2a = 2: All major decision categories covered, but geographic coverage gap (no SF/East Bay
      clubs) is a meaningful omission for RO4. Category A (pre-decision) partially addressed in
      overview but could be stronger. Nutrition gap noted.
      D2b = 2: Of 5 entity articles, all have complete data tables. However, the entity scope
      itself is incomplete -- landscape.yaml mentions East Bay Swim League, Waterworks Aquatics,
      and other entities that lack profiles. 4/5 existing entities are complete, but scope coverage
      is ~70% of what the topic demands.
      D2c = 3: Zero stubs. All 18 articles have substantial content (400-1300 words each).

  D3_accuracy:
    weight: 0.20
    score: 2.67
    weighted: 17.8
    sub_scores:
      D3a_attribution_compliance: 3
      D3b_confidence_discipline: 3
      D3c_conflict_documentation: 2
    notes: >
      D3a = 3: Sampled 20 claim sentences across articles. All use "According to X" attribution,
      cite specific PMC study IDs, or use appropriate epistemic hedging. Attribution compliance
      is excellent (estimated >95%).
      D3b = 3: Zero L5 claims in wiki (both c020 and c137 properly blocked). L4 sources (5 total)
      used with appropriate hedging ("Some compiled sources suggest..."; community sources not cited
      as fact). The cognitive-benefits article explicitly calls out c137 as blocked with explanation.
      D3c = 2: The early-specialization/burnout association conflict (3.76x burnout vs. PMC5968952
      finding no direct causal link) is properly documented with a Caution block. The PASA/Alto
      merger confusion is documented. However, there are likely minor source conflicts not explicitly
      flagged (e.g., different sources giving different age ranges for competitive readiness: 5-7
      vs. 8-12, addressed in getting-started but not formally documented as a conflict).

  D4_actionability:
    weight: 0.15
    score: 2.67
    weighted: 13.3
    sub_scores:
      D4a_decision_framing: 3
      D4b_common_mistakes: 3
      D4c_entry_point_clarity: 2
    notes: >
      D4a = 3: Articles use imperative voice throughout. Recreational-to-competitive has a 5-step
      action plan. Getting-started has a "Recommended Steps" section. Choosing-a-club-and-coach has
      a trial period strategy. Parent-playbook has specific "what to say" and "what NOT to say"
      prescriptions. Readers know what to do next.
      D4b = 3: Common Mistakes sections are exceptional across the wiki. They are specific and
      non-obvious: "Treating Level 4 at one program as equivalent to Level 4 at another" (getting-started),
      "Emailing the coach after every bad race" (parent-playbook), "Choosing a club based on fastest
      swimmers only -- look at senior retention" (choosing-a-club-and-coach), "Buying tech suits too
      early -- prohibited in some age-group events" (costs-and-commitment). These are genuinely
      actionable and not generic "start early" advice.
      D4c = 2: The overview.md has a clear Reading Roadmap with persona-based entry paths. However,
      if a reader lands on an entity article (e.g., alto-swim-club.md) first, there is no breadcrumb
      or "start here" pointer at the top. The See Also sections help but do not explicitly say
      "new to this wiki? start with overview.md". The _index.md exists but is an Obsidian index,
      not a reader-facing landing page.

  D5_perspective_balance:
    weight: 0.10
    score: 2.0
    weighted: 6.7
    notes: >
      Official school/org sources (L1-L2): Present and strong. USA Swimming, Pacific Swimming,
      AAP, NSCA, PMC studies all well-represented.
      Aggregator/review data (L3): Present. SwimSwam, JackrabbitClass, US Sports Camps cited
      throughout with proper attribution.
      Community/parent experience synthesis (L4): Weak. Only 5 L4 claims in the entire fact-sheet.
      No parent forum perspectives, no "what parents actually experience" sections. The wiki is
      very research-heavy and official-source-heavy, which is epistemically correct but misses
      the experiential dimension. A parent reading this wiki gets excellent evidence-based guidance
      but no sense of "what does it actually feel like when your 9-year-old starts competing?"
      Expert synthesis (consultants, journalists): Partially present via Swimming World Magazine
      and SwimSwam.
      Counterarguments ("why NOT to do X"): Present in Common Mistakes and the early-specialization
      article. The overview explicitly addresses "when NOT to start competitive training."
      Score = 2: Official + aggregator present, but community patterns absent.

