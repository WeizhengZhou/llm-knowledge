composite_breakdown:
  D1_reader_outcomes:
    weight: 0.30
    score: 2.71
    weighted: 27.1
    per_outcome:
      - id: RO1
        job: "Decide when and how to start a child in swimming"
        score: 3
        uncovered_must_answer: []
        notes: >
          Getting-started.md comprehensively covers age to start (AAP guidance via JackrabbitClass),
          water safety vs. stroke technique priority, and choosing a good swim school/instructor
          with a specific checklist (ratios, certifications, trial options). All 3 must_answer items
          fully addressed.

      - id: RO2
        job: "Understand what traits and conditions support swimming development"
        score: 3
        uncovered_must_answer: []
        notes: >
          Body-type-and-swimming.md covers physical traits with proper caveats (Chinese population
          study, age 17+ applicability). The body type vs. training question is directly addressed
          with the "what parents should/should not conclude" section. Psychological traits covered
          in parent-playbook.md (Self-Determination Theory, intrinsic motivation). Early development
          vs. genuine talent thoroughly addressed via the Late Developer Effect (PMC7174680: 75% of
          elite juniors do not become elite seniors; performance before 17 not predictive).

      - id: RO3
        job: "Evaluate and select a swim coach or club"
        score: 3
        uncovered_must_answer: []
        notes: >
          Choosing-a-club-and-coach.md covers USA Swimming and ASCA certifications, background
          checks, green flags and red flags, comprehensive question lists, Safe Sport section with
          reporting contacts, and a trial period strategy. All 4 must_answer items fully addressed.

      - id: RO4
        job: "Find Bay Area swim camps, clubs, and local resources"
        score: 2
        uncovered_must_answer:
          - "What competitive swim clubs exist in the Bay Area — SF, East Bay coverage is weak"
        notes: >
          Four club profiles exist (Alto, PASA, DACA, SCSC) covering Peninsula and South Bay well.
          Bay-area-swim-camps.md covers summer options with a useful comparison table. However,
          geographic coverage has a significant gap: there are no entity articles for SF, East Bay,
          or North Bay clubs. The must_answer item asks about "SF, East Bay, Peninsula, South Bay"
          but only Peninsula and South Bay are covered with specific clubs. The swim-meets-explained
          article lists Pacific Swimming zones (Zone 2 = Alameda/Contra Costa, Zone 3 = SF/Marin)
          but names no specific clubs in those zones. A parent in Oakland or San Francisco cannot
          use this wiki to find their local club.

      - id: RO5
        job: "Navigate the pathway from recreational to competitive swimming"
        score: 3
        uncovered_must_answer: []
        notes: >
          Developmental-pathway.md maps stages clearly. Getting-started.md covers pre-team/bridge
          programs with the UC Berkeley example. USA Swimming pathway covered in developmental-pathway
          and swim-meets-explained. First meet expectations covered in swim-meets-explained with
          packing list, check-in process, parent guidelines. Costs at each level covered in
          costs-and-commitment.md with a clear tiered table. All 5 must_answer items addressed.

      - id: RO6
        job: "Make informed decisions about sport specialization and multi-sport participation"
        score: 3
        uncovered_must_answer: []
        notes: >
          Early-specialization.md covers AAP recommendation (age 15-16), the 3.76x burnout
          association with early specialization, and the PMC10530013 study on actual specialization
          patterns. Swimming-and-other-sports.md covers complementary sports, cross-training benefits,
          scheduling strategies, and water polo transition. All 4 must_answer items fully addressed.

      - id: RO7
        job: "Keep a young swimmer healthy, motivated, and progressing long-term"
        score: 3
        uncovered_must_answer: []
        notes: >
          Preventing-burnout.md covers burnout signs (child and environment), dropout reasons
          (PMC5968952 systematic review), overtraining prevention with AAP guideline, and the
          off-ramp option. Parent-playbook.md covers supportive parenting with the "I love watching
          you swim" protocol, what not to do (6 specific anti-patterns), and process vs. outcome
          goals. Developmental-pathway.md provides training volume by age table. Preventing-burnout
          lists common reasons kids quit (had other things to do, lack of enjoyment, boredom).
          All 5 must_answer items fully addressed.

