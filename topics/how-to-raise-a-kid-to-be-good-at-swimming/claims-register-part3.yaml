  conflicts_list:
    - id: conflict-1
      claims: [c006, c020]
      description: "c006 (official USA Swimming) lists 8 & Under as a competitive age group; c020 (L3 aggregator) says USA Swimming operates meets for '10 and under' as the youngest group. 8 & Under exists per official source."
    - id: conflict-2
      claims: [c016]
      description: "c016 attributes the 'no more hours per week than age in years' rule to both NSCA (one source) and AAP (another source). Attribution to originating organization needs verification."
    - id: conflict-3
      claims: [c094, c103]
      description: "c094 (PMC6805065) states athletes specializing before age 12 face 3.76x higher burnout rates; c103 (PMC5968952) states no evidence that early specialization is a direct predictor of burnout/dropout. Distinction between correlation/association and direct causation. Fact-checker to resolve."

  unanswered_questions:
    - question_id: q38
      note: >
        The research plan includes q38 (long-term pathway to college) and the swim-parent-resources
        file notes information gaps including: Bay Area club-specific comparison data, financial aid
        pathways, longitudinal outcome data, pre-specialization period guidance (ages 5-9), and
        coaching quality verification beyond USA Swimming status. These are documented gaps in the
        publicly available source material, not failures of the research process.

    - question_id: qG1-numeric-cuts
      note: >
        Specific numeric cut times for Pacific Swimming standards (e.g., 11-12 Girls 100 Free
        PC-B in seconds) are only available in PDF documents at pacswim.org/swim-meet-times/standards.
        These PDFs are binary-compressed and were not extractable. Fact-checker must download and
        parse PDFs directly to obtain specific time values.

  data_quality_notes:
    - "bayarea-swim-clubs-depth.md is a compiled synthesis document (L1-official tier assigned by research-agent) but draws on multiple sources including altoswimclub.com, daca.org, and SwimCloud. Competitive ranking data (PLS 1,003 points, PASA 955.5 points, SCSC 685.5 points, DACA 375.0 points) appears in this file but the year of the Far Western rankings is not specified — fact-checker should verify which year these team point totals reflect."
    - "Stanford Swim Camp pricing URL in bayarea-summer-camps-2026.md has a malformed path (ussportscamps.com/swim/swim/nike/stanford-swim-camp). Verify against the correct URL: https://www.ussportscamps.com/swim/nike/stanford-swim-camp"
    - "Multiple sources accessed via search summary due to 403 errors (Mayo Clinic, DACA, Santa Clara Swim Club). Data from these sources is less reliable than direct fetches and should be re-verified."
    - "bayarea-swim-clubs-depth.md lists Pleasanton Seahawks under 'Zone 3' in the narrative but the Pacific Swimming Zone 2 clubs directory (pacswim-zone2-clubs.md) lists Pleasanton Seahawks under Zone 2. This is a conflict that fact-checker must resolve."
    - "The file raw/web/official/2026-04-09_usaswimming-coach-certification.md sources ASCA data from swimmingcoach.org which is assigned L2-authoritative — this is appropriate as ASCA is the official coaching association."

  file_structure_note: >
    Due to file size constraints, the claims register was written in three parts:
    - claims-register.yaml: header + entity groups 1-4 (c001-c046, program types, LTAD, age benchmarks, Pacific Swimming)
    - claims-register-part2.yaml: entity groups 5-20 (c047-c156, Bay Area clubs, camps, research, nutrition, water polo, etc.)
    - claims-register-part3.yaml: this file — coverage_summary only
    Fact-checker should treat all three files as a single logical register. Claim IDs c001-c156 are stable and sequential across files.
